<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        async function loadStudents() {
            const response = await fetch("https://6adea6f64e88f1bba4a53b5f.mockapi.io/students");
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            const students = await response.json();
            renderStudents(students);
        }
        window.addEventListener("load", () => {
            loadStudents();
            const submit = document.querySelector("#submit");
            submit.addEventListener("click", (e) => {
                e.preventDefault();
                const name = document.querySelector("#name");
                const age = document.querySelector("#age");
                const major = document.querySelector("#major");

                const newStudent = {
                    name: name.value,
                    age: parseInt(age.value),
                    major: major.value
                };
                addStudent(newStudent);
            })
        });
        function renderStudents(students) {
            const body = document.querySelector("#body");
            body.replaceChildren();
            students.forEach(student => {
                const li = document.createElement("li");
                const button = document.createElement("button");

                li.textContent = `${student.name}(${student.age}) - ${student.major}`;
                button.addEventListener("click", function (e) {
                    e.preventDefault();
                    if (confirm("삭제하시겠습니까?")) {
                        deleteStudent(student.id);
                    }
                });
                button.className = "btn btn-danger mx-3 fw-bold";
                button.textContent = "X"
                li.appendChild(button);
                body.appendChild(li);
            });
        }
        async function addStudent(student) {
            try {
                const response = await fetch("https://6adea6f64e88f1bba4a53b5f.mockapi.io/students", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(student)
                });
                if (!response.ok) {
                    throw new Error(`HTTP $(response.status)`);
                }
                await loadStudents();
            }
            catch (error) {
                alert(error);
            }
        }
        async function updateStudent(id, updatedData) {
            try{
                const response = await fetch(`${"https://6adea6f64e88f1bba4a53b5f.mockapi.io/students"}/${id}}`,{
                    method:"PATCH",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify(updatedData)
                });
                if(!response.ok){
                    throw new Error(`HTTP ${response.status}`);
                }
                await loadStudents();
            }
            catch(error){
                alert(error);
            }
        }

        async function deleteStudent(id) {
            try {
                const response = await fetch(`${"https://6adea6f64e88f1bba4a53b5f.mockapi.io/students"}/${id}`, {
                    method: "DELETE"
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                await loadStudents();
            }
            catch(error){
                alert(error);
            }
        }
    </script>
</head>

<body>
    <nav class="navbar bg-dark">
        <div class="text-white p-2 fw-bold">
            학생 관리 Program
        </div>
    </nav>
    <div class="container col-12 mt-3">
        <form method="get" action="">
            <div class="row g-3 mx-3">
                <label for="name" style="justify-content: flex; margin-bottom: 0%; padding-bottom: 3px;"
                    class="fw-bold">name</label>
                <input id="name" type="text" class="pt-0 mt-0 form-control">
                <label for="age" style="justify-content: flex; margin-bottom: 0%; padding-bottom: 3px;"
                    class="fw-bold">age</label>
                <input id="age" type="number" class="pt-0 mt-0 form-control">
                <label for="major" style="justify-content: flex; margin-bottom: 0%; padding-bottom: 3px;"
                    class="fw-bold">major</label>
                <input id="major" type="text" class="pt-0 mt-0 form-control">
                <input type="submit" class="btn btn-primary fw-bold" id="submit">
            </div>
        </form>
    </div>
    <label class="fw-bold mx-4 pt-4" style="font-size: larger;">
        <학생 리스트>
    </label>
    <div class="container p-3">
        <ul id="body">

        </ul>

    </div>
</body>

</html>
